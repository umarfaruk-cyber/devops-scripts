name: Secrets and Variables Demo

on:
  push:
    branches: [main]

env:
  APP_NAME: devops-scripts
  APP_VERSION: 1.0.0
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}

jobs:
  show-environment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Show public variables
        run: |
          echo "========================================"
          echo "PUBLIC VARIABLES (visible in logs)"
          echo "========================================"
          echo "App name: $APP_NAME"
          echo "App version: $APP_VERSION"
          echo "GitHub actor: ${{ github.actor }}"
          echo "GitHub repo: ${{ github.repository }}"
          echo "Log level: $LOG_LEVEL"
          echo "GitHub ref: ${{ github.ref_name }}"

  use-secrets-safely:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy using secrets
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "============================================="
          echo "SECRETS (automatically masked in logs)"
          echo "============================================="
          echo "Deploy_user: $DEPLOY_USER"
          echo "Deploy password length: ${#DEPLOY_PASSWORD} characters"
          echo "Docker username: $DOCKER_HUB_USERNAME"
          echo "Docker token: $DOCKER_HUB_TOKEN"
          echo " "
          echo "Secrets never print actual values in logs"
          echo "Github shows *** for masked values"
          echo " "
          echo "Simulating deployment..."
          echo "Using user: $DEPLOY_USER with credentials"
          echo "Logging into Docker Hub as: $DOCKER_HUB_USERNAME"
          echo "Deployment complete"

  access-control-demo:
    runs-on: ubuntu latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      - name: Production-only secrets
        env:
          PROD_API_KEY: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "This job can only see secrets in 'production' environment"
          echo "Different environments = different secrets!"
