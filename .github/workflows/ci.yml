name: Devops Scripts CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - show directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Files present:"
          ls -la

      - name: verify all scripts exist
        run: |
          echo "Checking all scripts are present..."
          for script in sysinfo.sh user_profile.sh bulk_users.sh backup_system.sh health_monitor.sh deploy.sh deploy_manager.sh system_audit.sh; do
            if [ -f "$script" ]; then
              echo "OK: $script exists"
            else
              echo "MISSING: $script"
              exit 1
            fi
          done

      - name: Check scripts are executable
        run: |
          echo "Checking scripts permissions..."
          chmod +x *.sh
          for script in *.sh; do
            if [ -x "$script" ]; then
              echo "OK: $script is executable..."
            else
              echo "FAILED: $script is not executable"
              exit 1
            fi
          done

      - name: Validate bash syntax
        run: |
          echo "Validating bash syntax for all scripts..."
          error_found=0
          for script in *.sh; do
            if bash -n "$script"; then
              echo "OK: $script syntax is valid"
            else
              echo "SYNTAX ERROR: $script"
              error_found=1
            fi
          done
          if [ $error_found -eq 1 ]; then
            echo "Syntax errors found - pipeline failed"
            exit 1
          fi

      - name: Run sysinfo script
        run: |
          echo "Running sysinfo.sh..."
          chmod +x sysinfo.sh
          ./sysinfo.sh

      - name: Check deploy_manager version file
        run: |
          echo "Verifying deploy_manager.sh structure..."
          if grep -q "bump_version" deploy_manager.sh; then
            echo "OK: bump version function found"
          else
            echo "MISSING: bump version function not found"
            exit 1
          fi
          if grep -q "deploy()" deploy_manager.sh; then
            echo "OK: deploy function found"
          else
            echo "MISSING: deploy function not found"
            exit 1
          fi
          if grep -q "rollback()" deploy_manager.sh; then
            echo "OK: rollback function found"
          else
            echo "MISSING: rollback function not found"
            exit 1
          fi

      - name: Pipeine complete
        run: |
          echo "=============================="
          echo "All checks passed successfully"
          echo "Scripts verified: $(ls *.sh | wc -l)"
          echo "=============================="
