name: Multi-job Pipeline

on:
 push:
  branches: [main]

jobs:
 lint:
  name: Lint scripts
  runs-on: ubuntu latest
  steps:
   - uses: actions/checkout@v3
   - name: Lint all scripts
     run: |
      echo "Running linting checks..."
      for script in *.sh; do
       bash -n "$script" && echo "OK: $script" || exit 1
      done
      echo "All scripts passed linting"

 test:
  name: Run tests
  runs-on: ubuntu latest
  needs: lint
  steps:
   - uses: actions/checkout@v3
   - name: Run tests
     run: |
      echo "Running integration tests...."
      chmod +x sysinfo.sh
      ./sysinfo.sh
      echo "Tests completed"

 security-check:
  name: Security scan
  runs-on: ubuntu latest
  needs: lint
  steps:
   - uses: actions/checkout@v3
   - name: Check for hardcoded passwords
     run: |
      echo "Scanning for hardcoded secrets..."
      if grep -r "password=" --include="*.sh" .2>/dev/null; then
       echo "Warning: Possible hardcoded password found"
      else
       echo "OK: No hardcoded passwords found"
      fi

 deploy-dev:
  name: Deploy to Development
  runs-on: ubuntu latest
  needs: [test, security-check]
  steps:
   - uses: actions/checkout@v3
   - name: Deploy to development
     run: |
      echo "================================================="
      echo "Deploying to development environment"
      echo "================================================="
      echo "Waiting for upstream jobs..."
      echo "Test job: ${{ needs.test.result }}"
      echo "Security job: ${{ needs.security-check.result }}"
      echo "All checks passed! Proceeding with deployment..."
      echo "Development deployment complete"

 notify:
  name: Pipeline Summary
  runs-on: ubuntu latest
  needs: deploy-dev
  if: always()
  steps:
   - name: Pipeline result
     run: |
      echo "====================================="
      echo "PIPELINE SUMMARY"
      echo "====================================="
      echo "Deploy job result: ${{ needs.deploy-dev.result }}"
      if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
       echo "Pipeline succeeded!"
      else
       echo "Pipeline failed!"
      fi
      echo "====================================="
